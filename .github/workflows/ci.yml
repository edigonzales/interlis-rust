name: Native and WASM checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo test --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: cargo build --locked
      - run: cargo install wasm-pack --version 0.15.1 --locked
      - run: wasm-pack build --target nodejs --out-dir target/pkg-node --out-name interlis --no-opt --no-default-features --features wasm --locked
      - run: wasm-pack build --target web --out-dir target/pkg-web --out-name interlis --no-opt --no-default-features --features wasm --locked
      - run: npm ci --ignore-scripts
        working-directory: tools/wasm-smoke
      - run: npx playwright install --with-deps chromium
        working-directory: tools/wasm-smoke
      - run: npm run test:node
        working-directory: tools/wasm-smoke
      - run: npm run test:browser
        working-directory: tools/wasm-smoke
