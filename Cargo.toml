[package]
name = "interlis-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Experimental INTERLIS analysis shared by native and WebAssembly hosts"

[lib]
name = "interlis"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "interlis-compiler"
path = "src/main.rs"
required-features = ["native-cli"]

[features]
default = ["native-cli"]
native-cli = [
    "dep:md-5", "dep:quick-xml", "dep:same-file", "dep:sha2", "dep:tempfile",
    "dep:time", "dep:ureq", "dep:url",
]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
logos = "0.16.1"
num-bigint = { version = "0.5.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = { version = "0.1.26", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
md-5 = { version = "0.10", optional = true }
quick-xml = { version = "0.39", optional = true }
same-file = { version = "1.0.6", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true, default-features = false }
